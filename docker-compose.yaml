x-game-base: &game-base
  build: .
  init: true
  volumes:
    - .:/app
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  tictactoe:
    <<: *game-base
    stdin_open: true
    tty: true
    command: ["--x", "human", "--o", "human"]

  training:
    <<: *game-base
    profiles: ["training"]
    tty: true
    entrypoint: ["python", "-m", "training.tictactoe.train"]
    command: ["--config", "training/tictactoe/config.example.yaml"]