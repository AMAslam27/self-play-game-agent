[project]
name = "tictactoe-rl"
version = "0.1.0"
description = "RL environments and agents for classic games, starting with TicTacToe."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "pyyaml",
    "matplotlib",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)",
]

[tool.poetry]
packages = [{ include = "games" }]

[tool.poetry.dependencies]
torch = { source = "pytorch-cuda" }

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.ruff]
line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "ARG",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["games"]


[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_optional = true
pretty = true
show_error_codes = true
explicit_package_bases = true
namespace_packages = true
exclude = '^(tests|tmp)/'


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]


[tool.coverage.run]
source = ["games"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"